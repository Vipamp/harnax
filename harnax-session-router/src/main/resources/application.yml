server:
  port: 8081
  # Trust X-Forwarded-For / X-Real-IP / X-Forwarded-Proto headers from nginx.
  # Without this, request.getRemoteAddr() returns the nginx IP instead of the real client IP,
  # and request.getScheme() returns "http" even if the client used HTTPS.
  forward-headers-strategy: native

spring:
  application:
    name: harnax-session-router
  mvc:
    async:
      request-timeout: 600000  # 10min — must exceed agent-service processing time + snapshot upload
  codec:
    max-in-memory-size: 16MB  # Support large payloads (e.g., base64 image data)
  
  # === 默认数据源：SQLite（本地模式） ===
  # 本地模式使用嵌入式 SQLite，无需外部数据库
  # 集群模式通过 --spring.profiles.active=cluster 切换到 MySQL
  datasource:
    url: ${ROUTER_DB_URL:jdbc:sqlite:${ROUTER_SQLITE_PATH:/var/lib/harnax-router/call-log.db}}
    driver-class-name: ${ROUTER_DB_DRIVER:org.sqlite.JDBC}
    username: ${ROUTER_DB_USERNAME:}
    password: ${ROUTER_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${ROUTER_DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
      leak-detection-threshold: 10000
      validation-timeout: 3000
      keepalive-time: 30000
  
  # Flyway 仅在 MySQL 模式下启用（cluster profile）
  flyway:
    enabled: ${ROUTER_FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  data:
    redis:
      host: ${REDIS_HOST:172.20.10.5}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000
      lettuce:
        pool:
          max-active: 50
          max-idle: 10
          min-idle: 2
          max-wait: 5000

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# Session Router Configuration
router:
  cache:
    type: ${CACHE_TYPE:local}          # Cache implementation: 'redis' or 'local' (default: local for dev)
    instance-ttl-seconds: 3             # Instance cache TTL (used by local cache)
    session-ttl-seconds: 300            # Session mapping cache TTL (used by local cache, 5 min default)
  health:
    heartbeat-timeout-ms: 30000   # Heartbeat timeout: 30 seconds
    check-interval-ms: 5000       # Health check interval: 5 seconds
  proxy:
    connect-timeout-ms: 5000      # Proxy connect timeout
    read-timeout-ms: 600000       # Proxy read timeout: 10min for AI processing
    max-in-memory-size-mb: 16     # Max in-memory buffer size for WebClient
    stream-timeout-minutes: 10    # SSE stream overall timeout: 10min for long AI tasks
    failover-max-retries: 2       # Max failover retry attempts
  idempotency:
    ttl-seconds: 60               # Request deduplication TTL
  circuit-breaker:
    failure-threshold: 3          # Failures before opening circuit
    open-duration-ms: 30000       # Time before trying half-open

# Unified internal authentication
harnax:
  auth:
    enabled: true
    service-id: ${SERVICE_ID:router-0}
    internal:
      shared-secret: ${HARNAX_AUTH_SECRET:change-me-in-production-min-32-chars!!}
      token-ttl-seconds: 300
    external:
      enabled: true
    # The bundled monitor UI is designed to be reached from a browser without
    # service-to-service credentials. Restrict by network boundary (nginx / VPC)
    # instead of by JWT.
    # IMPORTANT: Do NOT add `/api/router/` here — internal APIs like heartbeat
    # and instance registration rely on UnifiedAuthFilter to validate Bearer JWT
    # tokens and set AuthContext, which InternalAuthorizationInterceptor depends on.
    skip-paths:
      - /ui
      - /ui/
      - /index.html
      - /static/
      - /favicon.ico
      - /style.css  
      - /app.js
      - /api/router/monitor/

# Admin service URL for internal API calls (API key validation, session info)
admin:
  service:
    url: ${ADMIN_SERVICE_URL:http://172.20.10.5:8080}
  internal-api:
    secret: ${ADMIN_INTERNAL_API_SECRET:change-me-in-production-min-32-chars!!}

# Actuator / Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}

---
# === 集群模式配置（MySQL） ===
# 启动方式: java -jar harnax-session-router.jar --spring.profiles.active=cluster
spring:
  config:
    activate:
      on-profile: cluster
  
  datasource:
    url: ${DB_URL:jdbc:mysql://172.20.10.5:3306/harnax_router?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
      leak-detection-threshold: 10000
      validation-timeout: 3000
      keepalive-time: 30000
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true