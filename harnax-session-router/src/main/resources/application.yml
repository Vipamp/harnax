server:
  port: 8081

spring:
  application:
    name: harnax-session-router
  codec:
    max-in-memory-size: 16MB  # Support large payloads (e.g., base64 image data)
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/harnax_router?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
      leak-detection-threshold: 10000  # Detect connections held > 10s
      validation-timeout: 3000
      keepalive-time: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000
      lettuce:
        pool:
          max-active: 50
          max-idle: 10
          min-idle: 2
          max-wait: 5000

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# Session Router Configuration
router:
  cache:
    type: ${CACHE_TYPE:local}          # Cache implementation: 'redis' or 'local' (default: local for dev)
    instance-ttl-seconds: 3             # Instance cache TTL (used by local cache)
    session-ttl-seconds: 300            # Session mapping cache TTL (used by local cache, 5 min default)
  health:
    heartbeat-timeout-ms: 30000   # Heartbeat timeout: 30 seconds
    check-interval-ms: 5000       # Health check interval: 5 seconds
  proxy:
    connect-timeout-ms: 5000      # Proxy connect timeout
    read-timeout-ms: 60000        # Proxy read timeout (long for AI processing)
    max-in-memory-size-mb: 16     # Max in-memory buffer size for WebClient
    stream-timeout-minutes: 15    # SSE stream overall timeout (increased for long AI tasks)
    failover-max-retries: 2       # Max failover retry attempts
  cleanup:
    retention-days: 7             # Days to keep soft-deleted records
    cron: "0 0 3 * * ?"          # Cleanup runs daily at 3 AM
  security:
    enabled: false                # Legacy X-Api-Key auth disabled; using harnax-auth JWT instead
  idempotency:
    ttl-seconds: 60               # Request deduplication TTL
  circuit-breaker:
    failure-threshold: 3          # Failures before opening circuit
    open-duration-ms: 30000       # Time before trying half-open

# Unified internal authentication
harnax:
  auth:
    enabled: true
    service-id: ${SERVICE_ID:router-0}
    internal:
      shared-secret: ${HARNAX_AUTH_SECRET:change-me-in-production-min-32-chars!!}
      token-ttl-seconds: 300
    external:
      enabled: true

# Admin service URL for internal API calls (API key validation, session info)
admin:
  service:
    url: ${ADMIN_SERVICE_URL:http://localhost:8080}

# Actuator / Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}