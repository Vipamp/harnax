server:
  port: 8081
  # Trust X-Forwarded-For / X-Real-IP / X-Forwarded-Proto headers from nginx.
  # Without this, request.getRemoteAddr() returns the nginx IP instead of the real client IP,
  # and request.getScheme() returns "http" even if the client used HTTPS.
  forward-headers-strategy: native

spring:
  application:
    name: harnax-session-router
  # Exclude Redis auto-config — Redis is only initialized when CACHE_TYPE=redis
  # (see RedisConfig for the conditional LettuceConnectionFactory bean)
  # NOTE: Spring Boot 4.x renamed Redis* → DataRedis* auto-config classes
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
  mvc:
    async:
      # Must not be the shortest link on a stream: the router ends one itself after
      # router.proxy.stream-max-duration-minutes, so the container has to allow at least that long.
      request-timeout: 1800000  # 30min
  task:
    scheduling:
      # Health checks, call-log flushing, rate-limit and mapping cleanup all run as @Scheduled.
      # On the default single thread one task that blocks — a health check waiting on Redis — stops
      # every other one, including the log flush.
      pool:
        size: ${ROUTER_SCHEDULER_POOL_SIZE:4}
  codec:
    max-in-memory-size: 16MB  # Support large payloads (e.g., base64 image data)

  # === 默认数据源：SQLite（本地模式） ===
  # 本地模式使用嵌入式 SQLite，无需外部数据库
  # 集群模式通过 --spring.profiles.active=cluster 切换到 MySQL
  datasource:
    url: ${ROUTER_DB_URL:jdbc:sqlite:${ROUTER_SQLITE_PATH:tmp/harnax-router/call-log.db}}
    driver-class-name: ${ROUTER_DB_DRIVER:org.sqlite.JDBC}
    username: ${ROUTER_DB_USERNAME:}
    password: ${ROUTER_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${ROUTER_DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
      leak-detection-threshold: 10000
      validation-timeout: 3000
      keepalive-time: 30000

  # Flyway 仅在 cluster 模式下启用（见 application-cluster.yml）
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis configuration - only used when CACHE_TYPE=redis
  # In local mode (CACHE_TYPE=local), Redis is not needed.
  # Every key below is read explicitly by RedisConfig — keep the names in sync with it.
  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000             # Command timeout: a Redis stall fails in 3s instead of 60s
      connect-timeout: 2000     # TCP connect timeout
      # Routing state must never be evicted: run Redis with maxmemory-policy=noeviction.
      # For Redis HA set one of the two below (sentinel wins over cluster); otherwise this
      # single host is a hard dependency of the whole routing layer.
      sentinel:
        master: ${REDIS_SENTINEL_MASTER:}
        nodes: ${REDIS_SENTINEL_NODES:}        # host1:port1,host2:port2
        password: ${REDIS_SENTINEL_PASSWORD:}
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:}         # host1:port1,host2:port2,host3:port3
        max-redirects: ${REDIS_CLUSTER_MAX_REDIRECTS:3}
      # Lettuce uses one shared async connection, so pooling is not configured
      # (commons-pool2 is intentionally not a dependency).

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# Session Router Configuration
router:
  cache:
    # 'redis' or 'local'. Local means "single node, nothing shared": instance records and session
    # bindings live in memory for the lifetime of this process. The binding lifetime is not a knob —
    # it is the same RedisSessionMappingService.SESSION_TTL in both modes, so a session keeps its
    # agent for exactly as long in dev as it would in a cluster.
    type: ${CACHE_TYPE:local}
  health:
    heartbeat-timeout-ms: 30000   # Heartbeat timeout: 30 seconds
    check-interval-ms: 5000       # Health check interval: 5 seconds
  proxy:
    connect-timeout-ms: 5000      # Proxy connect timeout
    read-timeout-ms: 600000       # Proxy read timeout: 10min for AI processing (JSON calls only; streams bound themselves)
    max-in-memory-size-mb: 16     # Max in-memory buffer size for WebClient
    # Reactor Netty keeps one connection pool per host:port, so this caps what a SINGLE agent
    # instance may occupy — that is the point: a wedged instance cannot absorb the router.
    max-connections-per-instance: 50
    pending-acquire-timeout-ms: 10000   # How long a caller waits for a slot at a saturated instance
    pending-acquire-max-count: 100      # Waiters beyond this are refused fast instead of timing out together
    pool-max-idle-seconds: 60           # Idle connections kept for a reused agent
    pool-max-lifetime-minutes: 5        # Connections are recycled by age, so a rebalanced agent is not held
    stream-idle-timeout-seconds: 120    # A stream that says nothing for this long is over
    stream-max-duration-minutes: 30     # Wall-clock cap on one stream, however chatty it is
    failover-max-retries: 2       # Max failover retry attempts
  migration:
    # Tell the instance a session left to stop its sandbox (STOP_SANDBOX: workspace snapshot kept,
    # history and plans untouched). Best-effort and off the request thread.
    evict-old-instance: true
    max-pending: 200              # Evictions queued before new ones are dropped
  idempotency:
    ttl-seconds: 60               # Request deduplication TTL
  cors:
    # Browser requests carry the page's Origin. The entry point is the standard HTTPS port, so
    # the browser sends `https://localhost` with NO port — and the pattern `https://localhost:*`
    # does not match that, because its `*` stands for a port that must be present. Hence the
    # port-less entries below. An Origin matching none of these is rejected by CorsFilter with a
    # bare 403 "Invalid CORS request" *before* authentication, which the UI shows as a permission
    # error rather than a missing credential. Keep in sync with docker-compose.yml.
    allowed-origins: ${ROUTER_CORS_ALLOWED_ORIGINS:http://localhost,https://localhost,http://127.0.0.1,https://127.0.0.1,http://localhost:*,https://localhost:*,http://127.0.0.1:*,https://127.0.0.1:*}
  circuit-breaker:
    failure-threshold: 3          # Consecutive retryable failures before opening the circuit
    open-duration-ms: 30000       # How long an open circuit refuses new placements
    probe-lease-ms: 30000         # How long a half-open circuit holds the slot for its single probe

# Unified internal authentication
harnax:
  auth:
    enabled: true
    service-id: ${SERVICE_ID:router-0}
    internal:
      shared-secret: ${HARNAX_AUTH_SECRET:change-me-in-production-min-32-chars!!}
      token-ttl-seconds: 300
    external:
      enabled: true
    # The monitor UI is served from here, but its data is not free: /api/router/monitor/instances
    # is a map of the cluster's internal addresses and /call-logs is every call the router has seen,
    # with session ids and error text. Both therefore require a credential like any other endpoint —
    # the page passes the same Bearer token or X-Api-Key the rest of the API takes. Only the files
    # that render the page stay open.
    # IMPORTANT: Do NOT add `/api/router/` here — internal APIs like heartbeat
    # and instance registration rely on UnifiedAuthFilter to validate Bearer JWT
    # tokens and set AuthContext, which InternalAuthorizationInterceptor depends on.
    #
    # Workspace APIs are protected by UnifiedAuthFilter (supports both JWT and X-Api-Key).
    skip-paths:
      - /ui
      - /ui/
      - /index.html
      - /static/
      - /favicon.ico
      - /style.css
      - /app.js

# Admin service URL for internal API calls (API key validation, session info)
admin:
  service:
    url: ${ADMIN_SERVICE_URL:http://172.20.10.5:8080}
  internal-api:
    secret: ${ADMIN_INTERNAL_API_SECRET:change-me-in-production-min-32-chars!!}

# Actuator / Metrics
management:
  endpoint:
    health:
      # /actuator/health/liveness answers "is this process running" — the only question a container
      # restart should key on. /actuator/health/readiness answers "can this node route"; its members
      # are configured in application-cluster.yml, where the shared state actually exists.
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
