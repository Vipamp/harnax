# === 集群模式配置（MySQL + Redis） ===
# 启动方式: --spring.profiles.active=cluster 或 SPRING_PROFILES_ACTIVE=cluster
#
# 此文件覆盖 application.yml 中的以下配置：
# - datasource: SQLite → MySQL
# - flyway: disabled → enabled
# - router.cache.type: local → redis

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://172.20.10.5:3306/harnax_router?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
      leak-detection-threshold: 10000
      validation-timeout: 3000
      keepalive-time: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:172.20.10.5}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

router:
  cache:
    type: redis
