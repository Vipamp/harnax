# === 集群模式配置（MySQL + Redis） ===
# 启动方式: --spring.profiles.active=cluster 或 SPRING_PROFILES_ACTIVE=cluster
#
# 此文件覆盖 application.yml 中的以下配置：
# - datasource: SQLite → MySQL
# - flyway: disabled → enabled
# - router.cache.type: local → redis

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://172.20.10.5:3306/harnax_router?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
      leak-detection-threshold: 10000
      validation-timeout: 3000
      keepalive-time: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:172.20.10.5}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

router:
  cache:
    type: redis
  # 会话反向索引对账：多节点写入下索引会与绑定漂移，导致选实例时负载统计失真。
  # 每轮只有一个节点执行（Redis 全局锁），其余节点跳过。
  reconcile:
    interval-ms: ${ROUTER_RECONCILE_INTERVAL_MS:300000}
    batch-size: ${ROUTER_RECONCILE_BATCH_SIZE:500}
    max-batches-per-index: ${ROUTER_RECONCILE_MAX_BATCHES:40}

management:
  endpoint:
    health:
      group:
        # 就绪探针只看路由能力本身：绑定、选实例、熔断状态全在 Redis 里，Redis 不可达时
        # 该节点就不该留在负载均衡里。调用日志库（MySQL）不参与：写日志失败不该让路由下线。
        readiness:
          include: readinessState,redis
