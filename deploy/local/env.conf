# Harnax Local Development Environment Configuration
# 本地开发模式 - 不依赖 Docker

# ==========================================
# MySQL Configuration (唯一硬性依赖)
# ==========================================
# 请确保本地已安装并启动 MySQL 8.0+
# macOS:   brew install mysql && brew services start mysql
# Ubuntu:  sudo apt install mysql-server && sudo systemctl start mysql
# Windows: scoop install mysql 或下载安装包
MYSQL_PORT=3306
MYSQL_HOST=127.0.0.1

# 数据库凭证（需与本地 MySQL 匹配）
DB_USERNAME=root
DB_PASSWORD="Hqs123456"

# 各服务数据库
ADMIN_DB_NAME=harnax_admin
ADMIN_DB_URL="jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${ADMIN_DB_NAME}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"

AGENT_DB_NAME=harnax_admin
AGENT_DB_URL="jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${AGENT_DB_NAME}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"

AGENTSCOPE_DB_NAME=agentscope
AGENTSCOPE_DB_URL="jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${AGENTSCOPE_DB_NAME}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"

# ==========================================
# Session Router (本地模式: SQLite + Caffeine 缓存，无需 MySQL/Redis)
# ==========================================
ROUTER_DB_URL=jdbc:sqlite:tmp/harnax-router/call-log.db
ROUTER_DB_DRIVER=org.sqlite.JDBC
CACHE_TYPE=local

# ==========================================
# MinIO (可选，本地开发不启用)
# ==========================================
MINIO_ENABLED=false

# ==========================================
# Sandbox (可选，本地开发不启用 Docker Sandbox)
# ==========================================
SANDBOX_ENABLED=false

# ==========================================
# Service Ports
# ==========================================
ADMIN_PORT=8080
ROUTER_PORT=8081
AGENT_SERVICE_PORT=8082
CHANNEL_SERVICE_PORT=8083
SCHEDULER_PORT=8084
WEBUI_PORT=3389

# ==========================================
# Security Secrets (开发环境默认值)
# ==========================================
JWT_SECRET=harnax-secret-key-2026-dev-only-do-not-use-in-production!!
ADMIN_INTERNAL_API_SECRET=dev-internal-api-secret-change-in-production-32chars!!
HARNAX_AUTH_SECRET=dev-auth-secret-change-in-production-min-32-chars!!

# ==========================================
# JVM Options
# ==========================================
JVM_OPTS="-Xms128m -Xmx512m"

# ==========================================
# Maven Options
# ==========================================
MAVEN_OPTS="-T 2 -DskipTests"
