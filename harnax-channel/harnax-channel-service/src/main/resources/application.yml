server:
  port: 8083

spring:
  application:
    name: harnax-channel-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://172.20.10.5:3306/harnax_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# Router configuration
router:
  service:
    url: ${ROUTER_URL:http://172.20.10.5:8081}

# Channel WebClient proxy configuration
channel:
  auto-start: true  # Auto-start all enabled channels on startup
  router-api-key: ${CHANNEL_API_KEY:}  # If empty, auto-fetch from admin
  auto-fetch-system-key: true  # Auto-fetch system key from admin if router-api-key is empty
  admin:
    url: ${ADMIN_SERVICE_URL:http://localhost:8080}
  proxy:
    connect-timeout-ms: 5000       # TCP connect timeout
    response-timeout-ms: 600000    # HTTP response timeout: 10min for AI processing

# Unified internal authentication
harnax:
  auth:
    enabled: true
    service-id: ${SERVICE_ID:channel-0}
    internal:
      shared-secret: ${HARNAX_AUTH_SECRET:change-me-in-production-min-32-chars!!}
      token-ttl-seconds: 300