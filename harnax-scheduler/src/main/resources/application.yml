server:
  port: ${SCHEDULER_PORT:8084}

spring:
  application:
    name: harnax-scheduler

  # Datasource configuration. Release 1 leaves this on harnax_admin: the service reads agent_task metadata
  # there, and this is the database its own Flyway migration creates the QRTZ_* cluster tables in. There is
  # deliberately one DataSource — Quartz auto-wires the primary one, which is what keeps the Spring-managed
  # pool and the cluster store the same thing. Release 2 moves the URL to harnax_scheduler.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/harnax_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:3}
      # Sizing: 30 ≥ threadCount(10) Quartz workers, each holding one connection for the length of a fire,
      # + the business queries + the cluster check-in, all from this one pool. QUARTZ_THREAD_COUNT and this
      # number move together — raising the worker count without raising the pool does not add capacity, it
      # just moves the wait from the scheduler onto the connection timeout.
      maximum-pool-size: ${DB_POOL_SIZE:30}
      idle-timeout: 30000
      pool-name: SchedulerHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # Flyway owns the Quartz cluster schema. A dedicated history table because this service's migrations
  # currently land in harnax_admin, whose own history belongs to admin's Flyway: two tools, two ledgers,
  # one database. `baseline-on-migrate` stays off on purpose — the history table is new, so V1 applies
  # clean, and baselining would let a half-migrated schema pass as complete.
  # The switch is SCHEDULER_FLYWAY_ENABLED, with admin's FLYWAY_ENABLED only as the fallback it nests to
  # (the same shape `spring.quartz.auto-startup` uses below). compose sets SPRING_FLYWAY_ENABLED directly
  # and so wins over this line either way; outside compose this is the difference between the documented
  # rollback escape hatch working and a hand-run restore having to reach for admin's key to stop — or start —
  # this node's own QRTZ_* tables.
  flyway:
    enabled: ${SCHEDULER_FLYWAY_ENABLED:${FLYWAY_ENABLED:true}}
    locations: classpath:db/migration
    table: flyway_schema_history_scheduler
    validate-on-migrate: true
    clean-disabled: true

  # Quartz Configuration
  quartz:
    job-store-type: ${QUARTZ_JOB_STORE:jdbc}
    # A disabled instance must not be a cluster member at all. Boot starts the scheduler by default, so
    # such a node checks in, acquires triggers and then refuses to run them — the fire is consumed, not
    # handed over, and a one-shot lost that way is lost forever. Leaving the cluster is the only refusal
    # that does not eat work; standby is still legal for registering the housekeeping job.
    auto-startup: ${SCHEDULER_QUARTZ_AUTO_STARTUP:${scheduler.enabled:true}}
    # `never`, and there is no setting to argue with: Boot's `always` runs the bundled Quartz script on
    # every start, and that script begins with DROP TABLE IF EXISTS — on a cluster that deletes the
    # schedule state every node shares each time one node restarts. V1__quartz_tables.sql creates it once.
    # For completeness about the default: Boot's own value for this key is `embedded`, so with a MySQL
    # datasource the script would not run even if this line were absent. Pinning `never` is therefore defence
    # against someone setting it to `always`, not the only barrier between this cluster and that DROP.
    jdbc:
      initialize-schema: never
    # Boot's own key (spring-boot-quartz's QuartzProperties; its metadata says defaultValue=false, so
    # this has to be stated). Since the job runs inline on the Quartz worker thread, that thread IS the
    # execution: without waiting, a SIGTERM drops the JVM mid-run and leaves agent_task_log at status=3
    # plus its agent_task_execution lock row at status=0 — both read as "still running" until
    # housekeeping reaps them up to 2× scheduler.timeout-seconds later, and the user watches a timeout
    # that never actually happened. Must be paired with stop_grace_period on the scheduler container:
    # waiting for jobs is worthless if the kernel sends SIGKILL first.
    # Every execution path this module has is now one of those jobs: a cron fire and a manual run are the
    # same kind of object (both `/trigger` and `/run-once` deliver a one-shot into the store), so both are
    # waited for, and neither is the bare daemon thread a restart used to cut in half. The capacity side of
    # that trade is the same fact: a manual run holds one of the `threadCount` workers below until it ends,
    # which is the intended model — that count, not a private pool, is a node's concurrency gate.
    wait-for-jobs-to-complete-on-shutdown: ${QUARTZ_WAIT_FOR_JOBS:true}
    properties:
      org:
        quartz:
          scheduler:
            instanceName: HarnaxScheduler
            instanceId: AUTO
          jobStore:
            # No `class` here on purpose: Boot installs LocalDataSourceJobStore so the store uses the
            # Spring-managed DataSource. Pinning org.quartz.impl.jdbcjobstore.JobStoreTX disconnects it.
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            tablePrefix: QRTZ_
            isClustered: "true"
            # How long until a dead node's triggers move to a survivor, which is what the misfireThreshold
            # below has to outlive. Quartz 2.5.2 (JobStoreSupport.calcFailedIfAfter) calls a state row stale
            # at its own last check-in + max(CHECKIN_INTERVAL, the checking node's own distance since its last
            # check-in) + 7500ms — 15000 + 7500 = 22.5s here — and a peer only evaluates that when its
            # ClusterManager thread wakes, which sleeps one check-in interval: +15s of poll granularity, and
            # +15s more if that peer's own check-in is a full interval late. 22.5~52.5s, never 15s.
            # docs/deploy-harnax-scheduler.md carries the same sum for operators.
            clusterCheckinInterval: 15000
            misfireThreshold: 60000
            # With clustering there is no local lock protecting trigger acquisition; without this two
            # nodes can each claim the same fire and one of them loses after doing the work.
            acquireTriggersWithinLock: "true"
            # JobDataMap values must be strings — which is exactly why it carries a taskId and the job
            # re-reads agent_task when it fires. A serialized AgentTask would also make every stored job
            # carry a stale copy of the prompt.
            useProperties: "true"
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: ${QUARTZ_THREAD_COUNT:10}
            threadPriority: 5

# MyBatis configuration
mybatis:
  # The task domain's entities and mappers moved into this module with release 2, so the aliases now come
  # from `com.agnetix.harnax.scheduler.entity`.
  #
  # `classpath*:` is kept on purpose, and while harnax-entity is still on the classpath that means this
  # pattern loads the old `AgentTask*Mapper.xml` from its jar too — three files whose namespaces point at
  # interfaces `@MapperScan` no longer scans. The overlap is harmless and temporary: MyBatis keys every
  # resultMap and every statement by its namespace, so the two sets register side by side in one
  # Configuration without either clashing with or shadowing the other (no bean conflict, no rewritten
  # statement), and the old ones are simply never called from this service. Task 8 of
  # docs/superpowers/plans/2026-09-14-scheduler-domain-migration.md deletes them from harnax-entity, which
  # is what makes this line single-sourced again; nothing before that task depends on them.
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.agnetix.harnax.scheduler.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.slf4j.Slf4jImpl}

# Springdoc OpenAPI (Swagger) configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
    operations-sorter: alpha
    tags-sorter: alpha
  default-flat-param-object: true

# Actuator / Metrics
management:
  endpoint:
    health:
      # Liveness answers "is this process running" — the only question a container restart should key
      # on. Whether this instance actually scheduled any tasks lives in /actuator/health (the
      # aggregate), where the `scheduler` indicator reports it, so a slow database does not restart
      # the process out from under its own retry loop.
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.agnetix.harnax: ${LOG_LEVEL:INFO}

# Scheduler configuration
scheduler:
  # Enable/disable scheduler on this instance. Disabled means this node takes no scheduling work: it
  # reconciles no task, registers no reconcile sweep, and stays out of the Quartz cluster altogether
  # (spring.quartz.auto-startup follows this key) rather than joining it just to consume fires it will
  # refuse. Every Quartz-touching write is refused with 40903 by SchedulerController's requireEnabled —
  # the full list is /tasks/{id}/trigger, /tasks/{id}/run-once, /reload, /tasks/{id}/start and
  # /tasks/{id}/pause. It does NOT mean inert — the housekeeping sweep is registered outside this gate on
  # purpose, and /tasks/logs/{id}/stop is deliberately open here (a stop writes no Quartz object), so a
  # disabled node can still receive one and leave a row at status=4 that nothing but expireStale ever
  # moves.
  enabled: ${SCHEDULER_ENABLED:true}
  # Upper bound on how long a lost reload notification stays invisible: the store and agent_task are not
  # one transaction, so a CRUD that reached no node is repaired by this sweep instead. Raising it trades
  # a longer blind window for fewer store reads; below ~15s the reads stop being negligible.
  # The sweep lives in the shared store, so this is one setting for the whole cluster rather than one per
  # node: a node booting with a different value reschedules the stored trigger to its own, which makes the
  # last node to boot the one that decides. Set it here, not per instance.
  reconcile-interval-seconds: ${SCHEDULER_RECONCILE_INTERVAL:60}
  # Unique instance ID for execution guard (auto-generated if not set)
  instance-id: ${SCHEDULER_INSTANCE_ID:}
  # Router URL for executing agent tasks
  router-url: ${SCHEDULER_ROUTER_URL:http://localhost:8081}
  # API Key for router authentication (SYSTEM type key)
  api-key: ${SCHEDULER_API_KEY:}
  # Admin service URL for session management
  admin-url: ${SCHEDULER_ADMIN_URL:http://localhost:8080}
  # Admin internal API secret for authentication
  admin-secret: ${SCHEDULER_ADMIN_SECRET:change-me-in-production-min-32-chars!!}
  # Seconds an execution may take. Two readers on purpose: the router call's read timeout and the
  # baseline the stale sweep judges a never-reported row against. Splitting them would let the sweep
  # expire work that is merely slow.
  timeout-seconds: ${SCHEDULER_TIMEOUT:300}
  # Ceiling for the session cleanup that follows the router call (DELETE /api/router/agent/session/{id});
  # effective value is min(this, timeout-seconds). It does not share timeout-seconds on purpose: that
  # would let one execution hold its Quartz worker for twice the timeout. The container's
  # stop_grace_period (docker-new/docker-compose.yml) is derived from
  # timeout + min(this, timeout) + 20 (the connect allowances) + 12 (write-back and shutdown hooks), so
  # raising this one means raising that one in the same change.
  clear-session-timeout-seconds: ${SCHEDULER_CLEAR_SESSION_TIMEOUT:60}
  # Ceiling for the INTERRUPT on the /stop path (POST /api/router/agent/command), which is a different
  # question from "did the run finish" and must not be answered on the execution's clock. Its one
  # constraint is the chain a user waits on: admin forwards /stop with a 30s read timeout
  # (SchedulerClientImpl), and stopTask writes agent_task_log around this call, so 10s is what leaves the
  # whole chain inside those 30s (see RouterClient.sendCommand for the budget). Nothing about it belongs
  # in the stop_grace_period sum above — stopTask runs on a request thread, never on a Quartz worker.
  # A timeout here is reported as an unanswered command, so the row stays at 4 for the executing node or
  # the stale sweep — a giving-up clock never reads as "nothing is running".
  command-timeout-seconds: ${SCHEDULER_COMMAND_TIMEOUT:10}

# Auth configuration
harnax:
  auth:
    # Stays false, deliberately: the flag also switches on UnifiedAuthFilter (external API keys, rate
    # limiting, @InternalOnly), which is a different and bigger design — spec §9 F1. What this service does
    # instead is verify the one thing a caller of /api/scheduler/** has to present, in
    # SchedulerConfig.internalTokenProvider + support/InternalCallerInterceptor.
    enabled: false
    # The label this service puts on what it signs: the JWT subject and the X-Caller-Id of every outgoing
    # call. Nothing on the inbound path decides anything from it. Same key admin sets to `admin`.
    service-id: scheduler
    internal:
      # From release 2 this key has a second job: it is no longer only what this service signs outgoing
      # tokens with, it is what the bearer on admin's forwards is verified against (contract C4). Both services
      # must be given the same value — compose feeds it to every service from one HARNAX_AUTH_SECRET, a
      # hand-deployed pair is the way to get it wrong. Must be at least 32 characters (see SchedulerConfig).
      shared-secret: ${HARNAX_AUTH_SECRET:change-me-in-production-min-32-chars!!}
      token-ttl-seconds: 300
