server:
  port: ${SCHEDULER_PORT:8084}

spring:
  application:
    name: harnax-scheduler

  # Datasource configuration (connects to harnax_admin DB for reading agent_task metadata)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/harnax_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:3}
      maximum-pool-size: ${DB_POOL_SIZE:10}
      idle-timeout: 30000
      pool-name: SchedulerHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # Flyway Configuration (disabled: admin manages migrations for harnax_admin db)
  flyway:
    enabled: ${FLYWAY_ENABLED:false}

  # Quartz Configuration
  quartz:
    job-store-type: ${QUARTZ_JOB_STORE:memory}
    # Boot's own key (spring-boot-quartz's QuartzProperties; its metadata says defaultValue=false, so
    # this has to be stated). Since the job runs inline on the Quartz worker thread, that thread IS the
    # execution: without waiting, a SIGTERM drops the JVM mid-run and leaves agent_task_log at status=3
    # plus its agent_task_execution lock row at status=0 — both read as "still running" until
    # housekeeping reaps them up to 2× scheduler.timeout-seconds later, and the user watches a timeout
    # that never actually happened. Must be paired with stop_grace_period on the scheduler container:
    # waiting for jobs is worthless if the kernel sends SIGKILL first.
    # What it waits for, though, is only what Quartz knows about: the cron path and the /run-once
    # one-shots. A manual /trigger runs on a bare daemon thread (SchedulerServiceImpl.triggerManually),
    # invisible to the scheduler, so no grace period protects it — plan S4 closes that gap.
    wait-for-jobs-to-complete-on-shutdown: ${QUARTZ_WAIT_FOR_JOBS:true}
    properties:
      org:
        quartz:
          scheduler:
            instanceName: HarnaxScheduler
            instanceId: AUTO
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: ${QUARTZ_THREAD_COUNT:10}
            threadPriority: 5

# MyBatis configuration
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.agnetix.harnax.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.slf4j.Slf4jImpl}

# Springdoc OpenAPI (Swagger) configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
    operations-sorter: alpha
    tags-sorter: alpha
  default-flat-param-object: true

# Actuator / Metrics
management:
  endpoint:
    health:
      # Liveness answers "is this process running" — the only question a container restart should key
      # on. Whether this instance actually scheduled any tasks lives in /actuator/health (the
      # aggregate), where the `scheduler` indicator reports it, so a slow database does not restart
      # the process out from under its own retry loop.
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.agnetix.harnax: ${LOG_LEVEL:INFO}

# Scheduler configuration
scheduler:
  # Enable/disable scheduler on this instance. Disabled means this node takes no scheduling work: it
  # loads no task, and every Quartz-touching write is refused with 40903 by SchedulerController's
  # requireEnabled — the full list is /tasks/{id}/trigger, /tasks/{id}/run-once, /reload,
  # /tasks/{id}/start and /tasks/{id}/pause. It does NOT mean inert — the housekeeping sweep is
  # registered outside this gate on purpose, and /tasks/logs/{id}/stop is deliberately open here (a stop
  # writes no Quartz object), so a disabled node can still receive one and leave a row at status=4 that
  # nothing but expireStale ever moves.
  enabled: ${SCHEDULER_ENABLED:true}
  # Unique instance ID for execution guard (auto-generated if not set)
  instance-id: ${SCHEDULER_INSTANCE_ID:}
  # Router URL for executing agent tasks
  router-url: ${SCHEDULER_ROUTER_URL:http://localhost:8081}
  # API Key for router authentication (SYSTEM type key)
  api-key: ${SCHEDULER_API_KEY:}
  # Admin service URL for session management
  admin-url: ${SCHEDULER_ADMIN_URL:http://localhost:8080}
  # Admin internal API secret for authentication
  admin-secret: ${SCHEDULER_ADMIN_SECRET:change-me-in-production-min-32-chars!!}
  # Seconds an execution may take. Two readers on purpose: the router call's read timeout and the
  # baseline the stale sweep judges a never-reported row against. Splitting them would let the sweep
  # expire work that is merely slow.
  timeout-seconds: ${SCHEDULER_TIMEOUT:300}
  # Ceiling for the session cleanup that follows the router call (DELETE /api/router/agent/session/{id});
  # effective value is min(this, timeout-seconds). It does not share timeout-seconds on purpose: that
  # would let one execution hold its Quartz worker for twice the timeout. The container's
  # stop_grace_period (docker-new/docker-compose.yml) is derived from timeout + min(this, timeout) + 20,
  # so raising this one means raising that one in the same change.
  clear-session-timeout-seconds: ${SCHEDULER_CLEAR_SESSION_TIMEOUT:60}

# Auth configuration
harnax:
  auth:
    enabled: false
    internal:
      shared-secret: ${HARNAX_AUTH_SECRET:change-me-in-production-min-32-chars!!}
