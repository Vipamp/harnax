server:
  port: ${SCHEDULER_PORT:8084}

spring:
  application:
    name: harnax-scheduler

  # Datasource configuration (connects to harnax_admin DB for reading agent_task metadata)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/harnax_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:3}
      maximum-pool-size: ${DB_POOL_SIZE:10}
      idle-timeout: 30000
      pool-name: SchedulerHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # Flyway Configuration
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    schemas: harnax_admin
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
    sql-migration-prefixes: V
    repeatable-sql-migration-prefixes: R

  # Quartz Configuration
  quartz:
    job-store-type: ${QUARTZ_JOB_STORE:memory}
    properties:
      org:
        quartz:
          scheduler:
            instanceName: HarnaxScheduler
            instanceId: AUTO
          jobStore:
            class: org.quartz.simpl.RAMJobStore
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: ${QUARTZ_THREAD_COUNT:10}
            threadPriority: 5

# MyBatis configuration
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.agnetix.harnax.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}

# Springdoc OpenAPI (Swagger) configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
    operations-sorter: alpha
    tags-sorter: alpha
  default-flat-param-object: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.agnetix.harnax: ${LOG_LEVEL:INFO}

# Scheduler configuration
scheduler:
  # Enable/disable scheduler on this instance
  enabled: ${SCHEDULER_ENABLED:true}
  # Unique instance ID for execution guard (auto-generated if not set)
  instance-id: ${SCHEDULER_INSTANCE_ID:}
  # Router URL for executing agent tasks
  router-url: ${SCHEDULER_ROUTER_URL:http://localhost:8081}
  # API Key for router authentication (SYSTEM type key)
  api-key: ${SCHEDULER_API_KEY:}
  # Admin service URL for session management
  admin-url: ${SCHEDULER_ADMIN_URL:http://localhost:8080}
  # Admin internal API secret for authentication
  admin-secret: ${SCHEDULER_ADMIN_SECRET:change-me-in-production-min-32-chars!!}
  # Timeout for router calls (seconds)
  timeout-seconds: ${SCHEDULER_TIMEOUT:300}

# Auth configuration
harnax:
  auth:
    enabled: false
    internal:
      shared-secret: ${HARNAX_AUTH_SECRET:change-me-in-production-min-32-chars!!}
