# Harnax Docker Compose - Local Mode (Development)
# Includes: MySQL + MinIO + Backend + Router + Agent-Service + Frontend

version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: harnax-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: harnax
      MYSQL_USER: harnax
      MYSQL_PASSWORD: harnax123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      # MySQL data directory
      - ${MYSQL_DATA_DIR:-./data/mysql}:/var/lib/mysql
      # Database initialization scripts
      - ./sql/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=500
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - harnax-network

  # MinIO Object Storage (for agent sandbox snapshots and distributed storage)
  minio:
    image: minio/minio:latest
    container_name: harnax-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - harnax-network

  # Backend Service (harnax-admin)
  backend:
    image: harnax-backend:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: harnax-backend
    restart: unless-stopped
    environment:
      # Spring Boot Configuration
      SPRING_PROFILES_ACTIVE: default
      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/harnax?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: harnax
      SPRING_DATASOURCE_PASSWORD: harnax123
      # Session Database Configuration
      SESSION_JDBC_URL: jdbc:mysql://mysql:3306/harnax?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SESSION_DATABASE_NAME: harnax
      SESSION_USERNAME: harnax
      SESSION_PASSWORD: harnax123
      # Flyway Configuration
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      LOCAL_TIME_ZONE: Asia/Shanghai
      LOCAL_TMP_DIR: ${LOCAL_TMP_DIR:-/tmp/harnax}
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-harnax-secret-key-2026-harnax-admin-backend-jwt-token-authentication}
      # Internal API Secret
      ADMIN_INTERNAL_API_SECRET: ${ADMIN_INTERNAL_API_SECRET:-change-me-in-production-min-32-chars!!}
      # Auth Secret
      HARNAX_AUTH_SECRET: ${HARNAX_AUTH_SECRET:-change-me-in-production-min-32-chars!!}
      # Router URL
      HARNAX_ROUTER_URL: http://router:8081
      # Log Configuration
      LOG_LEVEL: DEBUG
    ports:
      - "8080:8080"
    volumes:
      - backend-logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - harnax-network

  # Agent Service (distributed agent runtime with sandbox)
  agent-service:
    image: harnax-agent-service:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent-service
    container_name: harnax-agent-service
    restart: unless-stopped
    environment:
      # Database Configuration (business data)
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/harnax?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: harnax
      SPRING_DATASOURCE_PASSWORD: harnax123
      # Session Database Configuration (agent state, separate database)
      SESSION_JDBC_URL: jdbc:mysql://mysql:3306/agentscope?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SESSION_USERNAME: harnax
      SESSION_PASSWORD: harnax123
      SESSION_DATABASE_NAME: agentscope
      # MinIO Configuration
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      # Sandbox Configuration
      SANDBOX_ENABLED: "true"
      SANDBOX_IMAGE: harnax-sandbox:py-node
      SANDBOX_KEEP_ALIVE: "true"
      # Router Configuration
      ROUTER_SERVICE_URL: http://router:8081
      AGENT_INSTANCE_ID: agent-service-1
      # Auth Configuration
      HARNAX_AUTH_SECRET: ${HARNAX_AUTH_SECRET:-change-me-in-production-min-32-chars!!}
      JWT_SECRET: ${JWT_SECRET:-harnax-secret-key-2026-harnax-admin-backend-jwt-token-authentication}
      # Local temp directory
      LOCAL_TMP_DIR: /tmp/harnax-agent
      # Log Configuration
      LOG_LEVEL: DEBUG
    ports:
      - "8082:8082"
    volumes:
      - agent-service-logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket for sandbox management
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      router:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - harnax-network

  # Router Service (session routing, health checks, SSE proxy)
  # 本地模式使用 SQLite + local 缓存
  router:
    image: harnax-router:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.router
    container_name: harnax-router
    restart: unless-stopped
    environment:
      # 本地模式：使用 SQLite 存储调用日志
      ROUTER_SQLITE_PATH: /var/lib/harnax-router/call-log.db
      # 本地模式：使用内存缓存（单实例无需 Redis）
      CACHE_TYPE: local
      # Auth
      SERVICE_ID: router-0
      HARNAX_AUTH_SECRET: ${HARNAX_AUTH_SECRET:-change-me-in-production-min-32-chars!!}
      # Admin service (for API key validation + session info)
      ADMIN_SERVICE_URL: http://backend:8080
      ADMIN_INTERNAL_API_SECRET: ${ADMIN_INTERNAL_API_SECRET:-change-me-in-production-min-32-chars!!}
      # JVM
      JAVA_OPTS: -Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    ports:
      - "8081:8081"
    volumes:
      - router-logs:/app/logs
      - router-data:/var/lib/harnax-router  # SQLite 数据库持久化
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/api/router/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - harnax-network

  # Frontend Service
  frontend:
    image: harnax-frontend:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: harnax-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - router
      - agent-service
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - harnax-network

volumes:
  backend-logs:
    driver: local
  agent-service-logs:
    driver: local
  router-logs:
    driver: local
  router-data:
    driver: local
  minio-data:
    driver: local

networks:
  harnax-network:
    driver: bridge
