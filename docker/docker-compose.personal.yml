# Harnax Docker Compose - Personal Edition (Development)
# Includes: MySQL + Backend + Frontend

version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: harnax-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: harnax
      MYSQL_USER: harnax
      MYSQL_PASSWORD: harnax123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      # MySQL data directory - can be configured via environment variable
      - ${MYSQL_DATA_DIR:-./data/mysql}:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=500
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - harnax-network

  # Backend Service
  backend:
    image: harnax-backend:personal
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: harnax-backend-personal
    restart: unless-stopped
    environment:
      # Spring Boot Configuration
      SPRING_PROFILES_ACTIVE: personal
      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/harnax?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: harnax
      SPRING_DATASOURCE_PASSWORD: harnax123
      # Session Database Configuration
      SESSION_JDBC_URL: jdbc:mysql://mysql:3306/harnax?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SESSION_DATABASE_NAME: harnax
      SESSION_USERNAME: harnax
      SESSION_PASSWORD: harnax123
      # Flyway Configuration
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      # Log Configuration
      LOG_LEVEL: DEBUG
    ports:
      - "8080:8080"
    volumes:
      - backend-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - harnax-network

  # Frontend Service
  frontend:
    image: harnax-frontend:personal
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: harnax-frontend-personal
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - harnax-network

volumes:
  backend-logs:
    driver: local

networks:
  harnax-network:
    driver: bridge
