# Harnax Docker Compose - Personal Edition (Development)
# Includes: MySQL + Redis + Backend + Router + Frontend

version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: harnax-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: harnax
      MYSQL_USER: harnax
      MYSQL_PASSWORD: harnax123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      # MySQL data directory - can be configured via environment variable
      - ${MYSQL_DATA_DIR:-./data/mysql}:/var/lib/mysql
      # Database initialization scripts
      - ./sql/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=500
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - harnax-network

  # Backend Service
  backend:
    image: harnax-backend:personal
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: harnax-backend-personal
    restart: unless-stopped
    environment:
      # Spring Boot Configuration
      SPRING_PROFILES_ACTIVE: personal
      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/harnax?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: harnax
      SPRING_DATASOURCE_PASSWORD: harnax123
      # Session Database Configuration
      SESSION_JDBC_URL: jdbc:mysql://mysql:3306/harnax?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SESSION_DATABASE_NAME: harnax
      SESSION_USERNAME: harnax
      SESSION_PASSWORD: harnax123
      # Flyway Configuration
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      LOCAL_TIME_ZONE: Asia/Shanghai
      LOCAL_TMP_DIR: ${LOCAL_TMP_DIR:-/tmp/harnax}
      # Log Configuration
      LOG_LEVEL: DEBUG
    ports:
      - "8080:8080"
    volumes:
      - backend-logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - harnax-network

  # Frontend Service
  frontend:
    image: harnax-frontend:personal
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: harnax-frontend-personal
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - router
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - harnax-network

  # Redis (shared cache for router instances)
  redis:
    image: redis:7-alpine
    container_name: harnax-redis-personal
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - harnax-network

  # Router Service (session routing, health checks, SSE proxy)
  # 个人版使用 SQLite + local 缓存模式，无需 MySQL 和 Redis 依赖
  router:
    image: harnax-router:personal
    build:
      context: ..
      dockerfile: docker/Dockerfile.router
    container_name: harnax-router-personal
    restart: unless-stopped
    environment:
      # 本地模式：使用 SQLite 存储调用日志
      ROUTER_SQLITE_PATH: /var/lib/harnax-router/call-log.db
      # 本地模式：使用内存缓存（单实例无需 Redis）
      CACHE_TYPE: local
      # Auth
      SERVICE_ID: router-0
      HARNAX_AUTH_SECRET: ${HARNAX_AUTH_SECRET:-change-me-in-production-min-32-chars!!}
      # Admin service (for API key validation + session info)
      ADMIN_SERVICE_URL: http://backend:8080
      ADMIN_INTERNAL_API_SECRET: ${ADMIN_INTERNAL_API_SECRET:-change-me-in-production-min-32-chars!!}
      # JVM
      JAVA_OPTS: -Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    ports:
      - "8081:8081"
    volumes:
      - router-logs:/app/logs
      - router-data:/var/lib/harnax-router  # SQLite 数据库持久化
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/api/router/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - harnax-network

volumes:
  backend-logs:
    driver: local
  router-logs:
    driver: local
  router-data:
    driver: local
  redis-data:
    driver: local

networks:
  harnax-network:
    driver: bridge
