# Harnax Docker Compose - Production Environment
# Includes: Backend + Frontend (uses external database)

version: '3.8'

services:
  # Backend Service
  backend:
    image: harnax-backend:personal
    container_name: harnax-backend
    restart: always
    environment:
      # Spring Boot Configuration
      SPRING_PROFILES_ACTIVE: ${EDITION:-personal}
      # Database Configuration (external database)
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:mysql://db-host:3306/harnax?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-harnax}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-}
      # Session Database Configuration
      SESSION_JDBC_URL: ${SESSION_DB_URL:-${DB_URL:-jdbc:mysql://db-host:3306/harnax?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai}}
      SESSION_DATABASE_NAME: ${SESSION_DB_NAME:-harnax}
      SESSION_USERNAME: ${SESSION_DB_USERNAME:-${DB_USERNAME:-harnax}}
      SESSION_PASSWORD: ${SESSION_DB_PASSWORD:-${DB_PASSWORD:-}}
      # Flyway Configuration
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      # JVM Configuration
      JAVA_OPTS: -Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      # Log Configuration
      LOG_LEVEL: INFO
    ports:
      - "8080:8080"
    volumes:
      - /var/log/harnax:/app/logs
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '1.0'
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    networks:
      - harnax-network

  # Frontend Service
  frontend:
    image: harnax-frontend:personal
    container_name: harnax-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro  # SSL certificates
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.5'
          memory: 128M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    networks:
      - harnax-network

networks:
  harnax-network:
    driver: bridge
