# Native Image Properties
# 用于配置 GraalVM Native Image 构建参数

# 启用反射配置
-Dnative-image.reflect-config-file=META-INF/native-image/reflect-config.json

# 启用资源配置
-Dnative-image.resource-config-file=META-INF/native-image/resource-config.json

# JVM 参数
-Dnative-image.jvm-args=-Xmx4g

# 构建参数
-Dnative-image.build-args=--no-fallback,--enable-http,--enable-https,--enable-url-protocols=http,https,--enable-jni,--enable-reflection,--enable-resources,--enable-file-io,--enable-system-properties,--enable-jdk-proxies,--enable-cp1252,--enable-utf-8