# 企业版功能开关配置
vipclaw:
  edition: enterprise
  features:
    user-management: true
    token-monitor: true
    billing: false
    multi-tenant: false
    agent-sharing: true
    model-market: false
    skill-market: false
    phone-login: true
    email-login: true

# 生产环境禁用 Swagger
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
