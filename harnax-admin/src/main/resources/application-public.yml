# Public cloud edition feature toggle configuration
harnax:
  edition: public
  features:
    user-management: true
    token-monitor: true
    billing: true
    multi-tenant: true
    agent-sharing: true
    model-market: true
    skill-market: true
    phone-login: true
    email-login: true

# Disable Swagger in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
