server:
  port: ${ADMIN_PORT:8080}

spring:
  application:
    name: harnax-admin

  # Datasource configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/harnax_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_SIZE:20}
      idle-timeout: 30000
      pool-name: HarnaxHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
  
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # Flyway Configuration
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    repair-on-migrate: true
    clean-disabled: ${FLYWAY_CLEAN_DISABLED:true}
    sql-migration-prefixes: V
    repeatable-sql-migration-prefixes: R


# MyBatis configuration
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.agnetix.harnax.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}

# Springdoc OpenAPI (Swagger) configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
    operations-sorter: alpha
    tags-sorter: alpha
  default-flat-param-object: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.agnetix.harnax: ${LOG_LEVEL:INFO}

# JWT configuration (must match agent-service)
jwt:
  secret: ${JWT_SECRET:harnax-secret-key-2026-harnax-admin-backend-jwt-token-authentication}
  expiration: ${JWT_EXPIRATION:7200000}

# Session database configuration (for admin's own session storage)
session:
  jdbc-url: ${SESSION_JDBC_URL:jdbc:mysql://localhost:3306/harnax_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
  database-name: ${SESSION_DATABASE_NAME:harnax_admin}
  username: ${SESSION_USERNAME:root}
  password: ${SESSION_PASSWORD:123456}

local:
  tmp-dir: ${LOCAL_TMP_DIR:/home/harnax/skills}

# Captcha test master code for UI automation (harnax-ui-test).
# Empty (default) = disabled. Only set CAPTCHA_TEST_MASTER_CODE in test environments, NEVER in production.
captcha:
  test-master-code: ${CAPTCHA_TEST_MASTER_CODE:}

# Admin internal API authentication
# Other harnax services (channel, router, agent-service) use this secret
# to call admin's /api/internal/** endpoints via Authorization: Bearer <secret>
admin:
  internal-api:
    secret: ${ADMIN_INTERNAL_API_SECRET:change-me-in-production-min-32-chars!!}
  # Base URL for generating callback URLs (used by channel service)
  base-url: ${APP_BASE_URL:http://localhost:8080}

# UnifiedAuthFilter disabled in admin - admin uses its own JWT auth (JwtAuthenticationFilter)
# Only channel/router/agent-service use harnax-auth's UnifiedAuthFilter
harnax:
  auth:
    enabled: false
    internal:
      shared-secret: ${HARNAX_AUTH_SECRET:change-me-in-production-min-32-chars!!}
  router:
    url: ${HARNAX_ROUTER_URL:http://localhost:8081}
    external-url: ${HARNAX_ROUTER_EXTERNAL_URL:}
  aes:
    secret-key: ${HARNAX_AES_SECRET_KEY:change-me-32-chars-secret-key!!}
  scheduler:
    url: ${HARNAX_SCHEDULER_URL:http://localhost:8084}
