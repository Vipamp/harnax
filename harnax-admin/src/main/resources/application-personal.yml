# Personal edition feature toggle configuration
harnax:
  edition: personal
  features:
    user-management: false
    token-monitor: false
    billing: false
    multi-tenant: false
    agent-sharing: false
    model-market: false
    skill-market: false
    phone-login: false
    email-login: false

# Disable Swagger in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
