spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

# Reduce SQL console noise during integration tests
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    root: WARN
    com.agnetix.harnax: INFO
    org.springframework.web: WARN

# Fixed JWT secret so that tokens signed by the injected JwtUtil are accepted
jwt:
  secret: harnax-secret-key-2026-harnax-admin-backend-jwt-token-authentication
  expiration: 7200000

# Skill storage points to a throwaway temp directory
local:
  tmp-dir: ${java.io.tmpdir}/harnax-it/skills

# No package directory is mounted for ITs, and the registrar must not mistake that for a missing
# volume: an empty value is the "registration is not configured here" branch.
harnax:
  cli:
    package-dir: ""
  # The rollup's own knobs for the integration context. `rollup-enabled: false` is not a test shortcut: it is
  # what keeps the hourly cron from folding and releasing rows underneath the cases, which all drive rollUp()
  # directly, and the switch's behaviour is asserted in ToolInvocationRollupIT rather than assumed.
  # RETENTION_DAYS in that class is this number, and `a row just inside the window survives` is what proves
  # the two still agree.
  metrics:
    retention-days: 365
    rollup-enabled: false

skill:
  storage:
    type: local
    base-path: ${java.io.tmpdir}/harnax-it/skill-store

# Fixed internal API secret so InternalApiIT can call /api/admin/internal/**
admin:
  internal-api:
    secret: it-internal-api-secret-0123456789abcdef

# Disable swagger to speed up context startup
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
