server:
  port: ${AGENT_SERVICE_PORT:8082}

spring:
  application:
    name: harnax-agent-service
  
  # Database Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/harnax_admin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000

# MyBatis Configuration
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.agnetix.harnax.entity
  configuration:
    map-underscore-to-camel-case: true
    # Pinned on purpose. Entities declare non-null Kotlin properties with defaults, so nullable
    # columns must stay unset rather than being pushed through a setter as null.
    call-setters-on-nulls: false
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}

# Session Configuration (separate database for agent state)
session:
  jdbc-url: ${SESSION_JDBC_URL:jdbc:mysql://localhost:3306/agentscope?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
  username: ${SESSION_USERNAME:root}
  password: ${SESSION_PASSWORD:123456}
  database-name: ${SESSION_DATABASE_NAME:agentscope}

# Local Configuration
local:
  tmp-dir: ${LOCAL_TMP_DIR:/tmp/harnax-agent}

# Harness Configuration (distributed agent runtime)
harness:
  enable-workspace-context: ${HARNESS_ENABLE_WORKSPACE_CONTEXT:true}
  enable-memory-hooks: ${HARNESS_ENABLE_MEMORY_HOOKS:false}
  enable-session-persistence: ${HARNESS_ENABLE_SESSION_PERSISTENCE:true}
  # Second line of defence for stdio MCP servers: admin holds such rows back from delivery, and this
  # runtime refuses to start one even if a row reaches it. Same env var as the admin's own switch.
  mcp-stdio-enabled: ${HARNAX_MCP_STDIO_ENABLED:false}
  minio:
    enabled: ${MINIO_ENABLED:false}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    snapshot-bucket: ${MINIO_SNAPSHOT_BUCKET:harnax-snapshots}
    store-bucket: ${MINIO_STORE_BUCKET:harnax-store}
    output-bucket: ${MINIO_OUTPUT_BUCKET:harnax-output}
    # Must match the admin's `minio.cli-package-bucket`: it writes the registered packages there.
    cli-package-bucket: ${MINIO_CLI_PACKAGE_BUCKET:harnax-cli-packages}
    snapshot-prefix: ${MINIO_SNAPSHOT_PREFIX:snapshots/}
    store-prefix: ${MINIO_STORE_PREFIX:store/}
  sandbox:
    enabled: ${SANDBOX_ENABLED:false}
    image: ${SANDBOX_IMAGE:harnax-sandbox:py-node}
    workspace-root: ${SANDBOX_WORKSPACE_ROOT:/workspace}
    isolation-scope: ${SANDBOX_ISOLATION_SCOPE:SESSION}
    keep-alive: ${SANDBOX_KEEP_ALIVE:true}
    # A keep-alive container is removed once no turn has attached it for this long. The clock refreshes
    # when a turn starts, not while it runs, so this must stay above the longest single turn.
    keep-alive-max-idle-time-ms: ${SANDBOX_KEEP_ALIVE_MAX_IDLE_MS:1800000}
    # How often the reaper looks for expired sandboxes. The budget above only takes effect on a sweep.
    keep-alive-sweep-interval-ms: ${SANDBOX_KEEP_ALIVE_SWEEP_INTERVAL_MS:300000}
    network: ${SANDBOX_NETWORK:}
    # Where CLI package payloads are unpacked and cached, keyed by the package digest.
    cli-package-cache-dir: ${SANDBOX_CLI_PACKAGE_CACHE_DIR:/tmp/harnax-agent/cli-packages}
    # Values a CLI package's `${platform.*}` slots resolve to. The URL must be one a sandbox container
    # can reach, and the token is admin's internal API secret — the same value the admin service holds.
    platform-admin-url: ${SANDBOX_PLATFORM_ADMIN_URL:}
    platform-internal-token: ${SANDBOX_PLATFORM_INTERNAL_TOKEN:${ADMIN_INTERNAL_API_SECRET:}}
  output-detection:
    enabled: ${OUTPUT_DETECTION_ENABLED:true}
    max-file-size: ${OUTPUT_MAX_FILE_SIZE:52428800}
    max-files-per-response: ${OUTPUT_MAX_FILES:5}
    admin-base-url: ${OUTPUT_ADMIN_BASE_URL:}

# Logging Configuration
logging:
  level:
    com.agnetix.harnax: ${LOG_LEVEL:INFO}
    org.mybatis: ${MYBATIS_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Unified internal authentication
harnax:
  auth:
    enabled: true
    service-id: ${SERVICE_ID:agent-0}
    skip-paths: []
    internal:
      shared-secret: ${HARNAX_AUTH_SECRET:change-me-in-production-min-32-chars!!}
      token-ttl-seconds: 300

# JWT configuration (must match admin service)
jwt:
  secret: ${JWT_SECRET:harnax-secret-key-2026-harnax-admin-backend-jwt-token-authentication}
  expiration: ${JWT_EXPIRATION:7200000}

# Router configuration
router:
  service:
    url: ${ROUTER_SERVICE_URL:http://localhost:8081}

# Admin service configuration (for internal API calls)
admin:
  service:
    url: ${ADMIN_SERVICE_URL:http://localhost:8080}
  internal-api:
    secret: ${ADMIN_INTERNAL_API_SECRET:change-me-in-production-min-32-chars!!}

# Agent service configuration
agent:
  service:
    instance-id: ${AGENT_INSTANCE_ID:agent-service-1}
    heartbeat-interval-ms: ${AGENT_HEARTBEAT_INTERVAL:10000}
