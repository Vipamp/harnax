server:
  port: 8082

spring:
  application:
    name: harnax-agent-service
  
  # Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/harnax?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

# MyBatis Configuration
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.agnetix.harnax.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Session Configuration
session:
  jdbc-url: jdbc:mysql://localhost:3306/harnax?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
  username: root
  password: 123456
  database-name: harnax

# Local Configuration
local:
  tmp-dir: /tmp/harnax-agent

# Harness Configuration (distributed agent runtime)
harness:
  enable-workspace-context: true
  enable-memory-hooks: false
  enable-session-persistence: true
  minio:
    enabled: true
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    snapshot-bucket: harnax-snapshots
    store-bucket: harnax-store
    snapshot-prefix: snapshots/
    store-prefix: store/
  sandbox:
    enabled: true
    image: python:3.11-slim
    workspace-root: /workspace
    isolation-scope: SESSION
    keep-alive: false

# Logging Configuration
logging:
  level:
    com.agnetix.harnax: DEBUG
    org.mybatis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Unified internal authentication
harnax:
  auth:
    enabled: true
    service-id: ${SERVICE_ID:agent-0}
    internal:
      shared-secret: ${HARNAX_AUTH_SECRET:change-me-in-production-min-32-chars!!}
      token-ttl-seconds: 300

jwt:
  secret: harnax-secret-key-2026-harnax-admin-backend-jwt-token-authentication
  expiration: 7200000 # 2 hours (milliseconds)

router:
  service:
    url: http://localhost:8081

agent:
  service:
    instance-id: agent-service-1