server:
  port: 8082

spring:
  application:
    name: harnax-agent-service
  
  # Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/harnax?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

# MyBatis Configuration
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.agnetix.harnax.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Session Configuration
session:
  jdbc-url: jdbc:mysql://localhost:3306/harnax?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
  username: root
  password: root
  database-name: harnax

# Local Configuration
local:
  tmp-dir: /tmp/harnax-agent

# Logging Configuration
logging:
  level:
    com.agnetix.harnax: DEBUG
    org.mybatis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
