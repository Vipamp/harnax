# Harnax Docker Compose - Cluster Mode Deployment
# Includes: MySQL + Redis + MinIO + Admin + Router + Agent-Service + Channel-Service + Frontend
#
# Host port convention: the two public entry points are the standard 80 / 443 (nginx — the only
# service users open in a browser, hence no port in the URL). Every other published port is
# 20000 + the service's well-known port (five digits, leading 2), so `28080:8080` / `23306:3306`.
# Container-internal ports and the service-to-service URLs below stay unchanged — the shift only
# matters for access from the host machine, and the 2xxxx band keeps this stack clear of locally
# installed services that already hold 3306 / 6379 / 1xxxx from other projects.
#
# Usage:
#   Build images first: ./build.sh
#   Start services:     docker-compose up -d
#   View logs:          docker-compose logs -f
#   Stop services:      docker-compose down

services:
  # ==========================================
  # Infrastructure Services
  # ==========================================

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: harnax-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: harnax
      MYSQL_USER: ${DB_USERNAME:-harnax}
      MYSQL_PASSWORD: ${DB_PASSWORD:-harnax123}
      TZ: Asia/Shanghai
    ports:
      - "23306:3306"
    volumes:
      # MySQL data directory
      - ${MYSQL_DATA_DIR:-./data/mysql}:/var/lib/mysql
      # Database initialization scripts
      - ./sql/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    command: >
      --authentication-policy=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
      --skip-name-resolve
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    networks:
      - harnax-network

  # Redis (shared routing state for router instances in cluster mode)
  # Holds session bindings, the instance registry, reroute locks and circuit-breaker state.
  # maxmemory-policy MUST stay `noeviction`: evicting routing keys under memory pressure
  # silently unbinds sessions and drops locks, which is far worse than a write error.
  redis:
    image: redis:7-alpine
    container_name: harnax-redis
    restart: always
    # 6379 is published to the host, so it must not be unauthenticated: routing state, locks
    # and session bindings are all writable through it.
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:-harnax-redis-local}
    ports:
      - "26379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      # The server now requires a password, so an anonymous `ping` answers NOAUTH: probe with the
      # same value the command line uses (compose interpolates it before the container starts).
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-harnax-redis-local}' --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
    networks:
      - harnax-network

  # MinIO Object Storage (for agent sandbox snapshots and distributed storage)
  minio:
    image: minio/minio:latest
    container_name: harnax-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "29000:9000"   # API
      - "29001:9001"   # Console
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - harnax-network

  # ==========================================
  # Application Services
  # ==========================================

  # Admin Service (harnax-admin)
  admin:
    image: harnax-admin:latest
    container_name: harnax-admin
    restart: always
    environment:
      # Spring Boot Configuration
      SPRING_PROFILES_ACTIVE: prod
      # Database Configuration (harnax_admin: business data, shared with channel-service)
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:mysql://mysql:3306/harnax_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-harnax}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-harnax123}
      # Session Database Configuration (same as main datasource)
      SESSION_JDBC_URL: ${SESSION_JDBC_URL:-jdbc:mysql://mysql:3306/harnax_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
      SESSION_DATABASE_NAME: ${SESSION_DB_NAME:-harnax_admin}
      SESSION_USERNAME: ${DB_USERNAME:-harnax}
      SESSION_PASSWORD: ${DB_PASSWORD:-harnax123}
      # Flyway Configuration
      SPRING_FLYWAY_ENABLED: "${FLYWAY_ENABLED:-true}"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      FLYWAY_CLEAN_DISABLED: "${FLYWAY_CLEAN_DISABLED:-true}"
      # MyBatis SQL logging: the service default sends every statement to stdout, which no
      # running deployment wants; pin slf4j and let LOG_LEVEL set the noise level.
      MYBATIS_LOG_IMPL: ${MYBATIS_LOG_IMPL:-org.apache.ibatis.logging.slf4j.Slf4jImpl}
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-harnax-secret-key-2026-harnax-admin-backend-jwt-token-authentication}
      # Internal API Secret
      ADMIN_INTERNAL_API_SECRET: ${ADMIN_INTERNAL_API_SECRET:-change-me-in-production-min-32-chars!!}
      # Auth Secret
      HARNAX_AUTH_SECRET: ${HARNAX_AUTH_SECRET:-change-me-in-production-min-32-chars!!}
      # AES key for MCP / tool credentials at rest. The fallback is a string published in this
      # repository, so a deployment that leaves it here encrypts nothing an operator cannot undo:
      # put a real 32-character value in .env (see .env.example). Rotating it later makes the rows
      # written under the old key unreadable, so set it before configuring MCP servers, not after.
      HARNAX_AES_SECRET_KEY: ${HARNAX_AES_SECRET_KEY:-change-me-32-chars-secret-key!!}
      # stdio MCP servers are processes agent-service starts, and that container mounts the host
      # Docker socket - off until the runtime is isolated. One variable also sets the agent side.
      HARNAX_MCP_STDIO_ENABLED: ${HARNAX_MCP_STDIO_ENABLED:-false}
      # Router URL (for internal service communication)
      HARNAX_ROUTER_URL: ${HARNAX_ROUTER_URL:-http://router:8081}
      # Scheduler URL (for task trigger/start/pause)
      HARNAX_SCHEDULER_URL: ${HARNAX_SCHEDULER_URL:-http://scheduler:8084}
      # Router External URL (returned to frontend/mobile apps)
      HARNAX_ROUTER_EXTERNAL_URL: http://localhost:28081
      # Public origin of this deployment. Spring reads it as `app.base-url` to build callback URLs
      # (channel platform callbacks). Point it at whatever the upstream can actually reach (the
      # nginx front door when there is one); left unset it falls back to a localhost URL that is
      # right for nothing but this machine.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:28080}
      # Origin the browser is standing on, read as Spring's `app.frontend-base-url` and used for the
      # MCP OAuth redirect_uri, which is now a front-end route. Unset falls back to APP_BASE_URL - so
      # with the default above (admin's own port, which serves no page) an OAuth callback would land
      # on nothing: set this to the nginx origin, or set APP_BASE_URL to it.
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL:-}
      # MinIO Configuration (output file download proxy)
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      # JVM Configuration
      JAVA_OPTS: -Xms128m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication
      # Log Configuration
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "28080:8080"
    volumes:
      - admin-logs:/app/logs
      - admin-skills:/home/harnax/skills
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "code=$$(wget -q -O /dev/null --timeout=5 --server-response http://localhost:8080/api/admin/health 2>&1 | awk '/HTTP/{print $$2}' | tail -1); [ \"$$code\" = \"200\" ] || [ \"$$code\" = \"401\" ] || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '1.0'
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    networks:
      - harnax-network

  # Router Service (session routing, health checks, SSE proxy)
  # Cluster mode: MySQL + Redis (not SQLite + local cache)
  router:
    image: harnax-router:latest
    container_name: harnax-router
    restart: always
    environment:
      # Activate cluster profile: MySQL + Redis
      SPRING_PROFILES_ACTIVE: cluster
      # Database (MySQL for api_call_log)
      DB_URL: jdbc:mysql://mysql:3306/harnax_router?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-harnax}
      DB_PASSWORD: ${DB_PASSWORD:-harnax123}
      # Redis (cluster mode cache)
      CACHE_TYPE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-harnax-redis-local}
      # Auth
      # These `change-me` fallbacks are not harmless here: CACHE_TYPE above is `redis`, and
      # PlaceholderSecretCheck aborts startup instead of accepting tokens signed with a key that is
      # published in the repository. Put real values in docker-new/.env (see .env.example).
      SERVICE_ID: ${ROUTER_SERVICE_ID:-router-0}
      HARNAX_AUTH_SECRET: ${HARNAX_AUTH_SECRET:-change-me-in-production-min-32-chars!!}
      # Admin service (for API key validation + session info)
      ADMIN_SERVICE_URL: ${ADMIN_SERVICE_URL:-http://admin:8080}
      ADMIN_INTERNAL_API_SECRET: ${ADMIN_INTERNAL_API_SECRET:-change-me-in-production-min-32-chars!!}
      # CORS — both scheme forms are needed and, crucially, the port-less ones too: nginx now
      # serves the SPA on the standard 443, so the browser sends `Origin: https://localhost`
      # without a port, and Spring's `https://localhost:*` pattern does NOT match that. The
      # port-wildcard entries stay for clients that hit a service directly (app / mini-program
      # against 28081). A rejected Origin gets a bare 403 from CorsFilter before any auth runs.
      ROUTER_CORS_ALLOWED_ORIGINS: ${ROUTER_CORS_ALLOWED_ORIGINS:-http://localhost,https://localhost,http://127.0.0.1,https://127.0.0.1,http://localhost:*,https://localhost:*,http://127.0.0.1:*,https://127.0.0.1:*}
      # JVM
      JAVA_OPTS: -Xms128m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication
    ports:
      # Reaching the router directly bypasses nginx, so this is only safe because the router
      # authenticates its own APIs: the monitor page loads anonymously, but its data — node
      # addresses and the full call trail — answers 401 without a token or API key.
      - "28081:8081"
    volumes:
      - router-logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      admin:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      # Liveness only — a container restart cannot fix an unreachable Redis, and restarting every
      # router node during a Redis blip turns a short outage into a cold start for the whole cluster.
      # Readiness (which does watch Redis) belongs to the load balancer, not to the restart policy.
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '1.0'
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    networks:
      - harnax-network

  # Scheduler Service (agent task scheduling and execution)
  #
  # Two instances, and exactly two places decide that number: `--scale scheduler=2` at the command line
  # and roll-scheduler.sh below. No `deploy.replicas` here on purpose — a declarative replica count
  # fights the stop-one/replace-one dance the rolling update has to do.
  # The cluster itself lives in the shared QRTZ_* tables: same instanceName, instanceId=AUTO per node,
  # and a 15s check-in, so a dead node's triggers move to its peer inside 15~75s.
  #
  # This service deliberately has no `container_name`: a pinned name is unique, so Docker refuses to
  # scale the service at all — which is also why nothing here may be reached as `docker exec
  # harnax-scheduler …`. Go through `docker-compose -f docker-new/docker-compose.yml exec scheduler`,
  # and once two replicas exist add `--index=1`/`--index=2` (or the container id) to say which one.
  scheduler:
    image: harnax-scheduler:latest
    restart: always
    environment:
      # Spring Boot Configuration
      SPRING_PROFILES_ACTIVE: prod
      # Database Configuration (harnax_admin in release 1: agent_task metadata read, QRTZ_* cluster store
      # written; release 2 moves this URL to harnax_scheduler and the store moves with it)
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:mysql://mysql:3306/harnax_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-harnax}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-harnax123}
      # Flyway Configuration. The scheduler owns the Quartz schema's migrations now, and in this release it
      # runs them against the harnax_admin database into its own history table
      # flyway_schema_history_scheduler — admin's ledger in that database stays untouched. This override is
      # what decides whether QRTZ_* gets created at all: an env var beats the yml default, so leaving the
      # old `${FLYWAY_ENABLED:-false}` here would boot the node against a store that does not exist.
      # SCHEDULER_FLYWAY_ENABLED=false is the escape hatch for a rollback.
      SPRING_FLYWAY_ENABLED: "${SCHEDULER_FLYWAY_ENABLED:-true}"
      # Scheduler Configuration
      # One interpolation for every replica, on purpose: `false` here takes the whole deployment out of the
      # cluster (spring.quartz.auto-startup follows it), it is not a per-node switch. A hot standby is not
      # what the second replica is for — see roll-scheduler.sh.
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      # Leave empty. Compose hands the same value to both replicas, and agent_task_execution.instance_id is
      # the one label that would then say "one node" where there are two; Quartz's own cluster identity
      # never reads this knob (org.quartz.scheduler.instanceId=AUTO).
      SCHEDULER_INSTANCE_ID: ${SCHEDULER_INSTANCE_ID:-}
      SCHEDULER_ROUTER_URL: ${SCHEDULER_ROUTER_URL:-http://router:8081}
      SCHEDULER_API_KEY: ${SCHEDULER_API_KEY:-}
      SCHEDULER_ADMIN_URL: ${SCHEDULER_ADMIN_URL:-http://admin:8080}
      SCHEDULER_ADMIN_SECRET: ${ADMIN_INTERNAL_API_SECRET:-change-me-in-production-min-32-chars!!}
      SCHEDULER_TIMEOUT: ${SCHEDULER_TIMEOUT:-300}
      # Ceiling for the session cleanup that follows every execution (DELETE /api/router/agent/session);
      # the effective value is min(this, SCHEDULER_TIMEOUT). Second term of the stop_grace_period sum.
      SCHEDULER_CLEAR_SESSION_TIMEOUT: ${SCHEDULER_CLEAR_SESSION_TIMEOUT:-60}
      # Ceiling for INTERRUPT on the /stop path (POST /api/router/agent/command). Its only constraint is
      # the chain a waiting user is on, not the run's: admin forwards /stop with a 30s read timeout, and
      # stopTask still writes agent_task_log around this call — so raising it past a few seconds buys
      # nothing and puts the user's "stopped" answer past admin's own timeout. Deliberately NOT part of
      # the stop_grace_period sum below (that one covers the Quartz worker; this call runs on a request
      # thread, which is also why a slow router leaves the row at 4 rather than calling it stopped).
      SCHEDULER_COMMAND_TIMEOUT: ${SCHEDULER_COMMAND_TIMEOUT:-10}
      # Auth Configuration
      HARNAX_AUTH_SECRET: ${HARNAX_AUTH_SECRET:-change-me-in-production-min-32-chars!!}
      # JVM Configuration
      JAVA_OPTS: -Xms128m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication
    # Container network only: the scheduler runs with harnax.auth.enabled=false, so publishing 8084
    # would hand out its write endpoints (/tasks/{id}/pause, /reload, /tasks/logs/{id}/stop) to anyone
    # who can reach the host, bypassing the owner checks admin applies before it forwards.
    # admin reaches it through http://scheduler:8084 on harnax-network.
    expose:
      - "8084"
    volumes:
      - scheduler-logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mysql:
        condition: service_healthy
      admin:
        condition: service_started
      router:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Docker's default is 10s, which cuts a shutdown right through a live execution: the JVM gets
    # SIGTERM, spring.quartz.wait-for-jobs-to-complete-on-shutdown=true makes it wait for the running
    # job, and SIGKILL arrives 10s later anyway — leaving agent_task_log at status=3 and its
    # agent_task_execution lock row at status=0 for housekeeping to reap (up to 2× timeout).
    #
    # THIS GRACE COVERS THE CRON PATH ONLY. A manual /api/scheduler/tasks/{id}/trigger still runs on a
    # bare daemon thread (SchedulerServiceImpl.triggerManually) that Quartz has never heard of, so
    # nothing waits for it on shutdown: restarting this container mid-manual-run cuts that execution into
    # exactly the two rows above. Until one-shot runs move into Quartz (plan S4), do not restart the
    # scheduler while a manual execution may be in flight — and with two replicas "which one" is not
    # knowable from the peer: admin's forward reaches whichever node Docker DNS picked, so the roll has to
    # assume either of them is busy and gives both the full grace.
    #
    # What one execution can hold its Quartz worker for, added up term by term. Every term is a timeout
    # this repo sets, so the number is a sum and not a rounded guess:
    #   300  chat's read timeout (SCHEDULER_TIMEOUT, default 300 here) — the worst case for the call
    #        itself, since the job now runs inline on this thread and only returns once it ends
    #    60  clearSession (DELETE /api/router/agent/session/{id}: snapshot upload + container destroy),
    #        bounded by its own read timeout min(SCHEDULER_CLEAR_SESSION_TIMEOUT, SCHEDULER_TIMEOUT).
    #        It used to inherit the 300s chat budget, so the real worst case was 600s and this number was
    #        wrong by a whole execution; a best-effort cleanup is not worth 300s of shutdown.
    #    20  the connect timeouts those two calls pay *before* their read clocks start: 10s each
    #        (RouterClient.requestClient). A router whose host blackholes packets costs 10s and then
    #        never answers, so a call's ceiling is 10 + its read timeout — the old "+20 for the
    #        write-back" was in fact already spent here, which is what left this sum without a single
    #        second of slack.
    #     8  the write-back that turns a finished run into terminal rows: finishExecution's UPDATE, the
    #        0-row path's re-read plus second UPDATE (closeOutLateExecution), and updateExecutionStatus'
    #        release of the agent_task_execution lock row — at most four statements, budgeted 2s each.
    #        On a warm pool they are milliseconds; HikariCP's 30s connection-timeout is an emergency
    #        bound this sum deliberately does not size for (if it ever fires, no grace period saves it).
    #     4  Spring's own shutdown hooks once the worker is back: Quartz standby, web-server stop,
    #        datasource close — all of them no-work paths at that point, budgeted rather than measured.
    #   392  the sum, and the 400s below is that rounded up. Not exactly SCHEDULER_TIMEOUT on purpose
    #        either: the read timeouts only cover the router calls, and the seconds after them are
    #        precisely the ones that turn a finished run into a terminal row — cut them and the execution
    #        is remembered as a timeout even though the answer was already in hand.
    # If SCHEDULER_TIMEOUT is raised, raise this with it. The rule is:
    #     timeout + min(clearSessionCap, timeout) + 20 + 12      with clearSessionCap = SCHEDULER_CLEAR_SESSION_TIMEOUT (60)
    # so 300 here gives 392 → 400s, and SCHEDULER_TIMEOUT=600 would give 692 → 700s. Both knobs move it:
    # raising SCHEDULER_CLEAR_SESSION_TIMEOUT to 300 without touching this puts SIGKILL back in the middle
    # of the DELETE — the exact comment-that-lies-by-default G1 removed.
    #
    # NOT in this sum: the /stop chain. SchedulerServiceImpl.stopTask answers admin's forward on a Tomcat
    # request thread and never holds a Quartz worker, so nothing about a shutdown waits for it. Its router
    # call is sized against a different budget instead — scheduler.command-timeout-seconds (10s), which
    # has to fit inside admin's 30s read timeout on the forward (SchedulerClientImpl). Do not "align" the
    # two numbers: they bound different threads against different consequences.
    #
    # A second copy of this number lives in docker-new/roll-scheduler.sh (`docker stop -t`, overridable
    # with SCHEDULER_STOP_GRACE), which is where a deploy spends this period one replica at a time: the
    # roll stops a replica and lets its peer cover the cluster. Move the two together — a roll timeout
    # shorter than this period SIGKILLs an execution mid-run, which is the whole thing the period stops.
    stop_grace_period: 400s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    networks:
      - harnax-network

  # Agent Service (distributed agent runtime with sandbox)
  agent-service:
    image: harnax-agent-service:latest
    container_name: harnax-agent-service
    restart: always
    environment:
      # Database Configuration (business data, shared with admin/channel-service)
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:mysql://mysql:3306/harnax_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-harnax}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-harnax123}
      # Session Database Configuration (agent state, separate database)
      SESSION_JDBC_URL: jdbc:mysql://mysql:3306/agentscope?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SESSION_USERNAME: ${DB_USERNAME:-harnax}
      SESSION_PASSWORD: ${DB_PASSWORD:-harnax123}
      SESSION_DATABASE_NAME: agentscope
      # MinIO Configuration
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      # Sandbox Configuration
      SANDBOX_ENABLED: "true"
      SANDBOX_IMAGE: harnax-sandbox:py-node
      SANDBOX_KEEP_ALIVE: "true"
      # Docker network for sandbox containers (default: bridge).
      # Set to a custom network name if sandbox needs to reach other services by DNS name.
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-docker-new_harnax-network}
      # CLI Plugin Configuration (sandbox plugin injection)
      SANDBOX_CLI_PLUGINS_ENABLED: "true"
      SANDBOX_PLUGIN_IMAGE: harnax-sandbox:py-node
      SANDBOX_PLUGIN_ADMIN_URL: http://admin:8080
      SANDBOX_PLUGIN_INTERNAL_SECRET: ${ADMIN_INTERNAL_API_SECRET:-change-me-in-production-min-32-chars!!}
      # Router Configuration
      ROUTER_SERVICE_URL: http://router:8081
      AGENT_INSTANCE_ID: ${AGENT_INSTANCE_ID:-agent-service-1}
      # Admin Service (for agent task spec fetching)
      ADMIN_SERVICE_URL: ${ADMIN_SERVICE_URL:-http://admin:8080}
      ADMIN_INTERNAL_API_SECRET: ${ADMIN_INTERNAL_API_SECRET:-change-me-in-production-min-32-chars!!}
      # Auth Configuration
      HARNAX_AUTH_SECRET: ${HARNAX_AUTH_SECRET:-change-me-in-production-min-32-chars!!}
      JWT_SECRET: ${JWT_SECRET:-harnax-secret-key-2026-harnax-admin-backend-jwt-token-authentication}
      # Local temp directory
      MYBATIS_LOG_IMPL: ${MYBATIS_LOG_IMPL:-org.apache.ibatis.logging.slf4j.Slf4jImpl}
      LOCAL_TMP_DIR: ${LOCAL_TMP_DIR:-/tmp/harnax-agent}
      # JVM Configuration
      JAVA_OPTS: -Xms256m -Xmx1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseStringDeduplication
      # Log Configuration
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Workspace context reads AGENTS.md via sandbox filesystem, but sandbox is only
      # active during acting phase — causes noisy SandboxConfigurationException logs.
      HARNESS_ENABLE_WORKSPACE_CONTEXT: "false"
      # Second line of defence for stdio MCP servers: this is the runtime that would spawn the
      # process. Admin holds such rows back from delivery as well; both have to be on to run one.
      HARNAX_MCP_STDIO_ENABLED: ${HARNAX_MCP_STDIO_ENABLED:-false}
    ports:
      - "28082:8082"
    volumes:
      - agent-service-logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket for sandbox management
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      router:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "code=$$(wget -q -O /dev/null --timeout=5 --server-response http://localhost:8082/api/agent/health 2>&1 | awk '/HTTP/{print $$2}' | tail -1); [ \"$$code\" = \"200\" ] || [ \"$$code\" = \"401\" ] || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '1.0'
          memory: 1024M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    networks:
      - harnax-network

  # Channel Service (multi-channel integration: Feishu, WeChat, etc.)
  channel-service:
    image: harnax-channel-service:latest
    container_name: harnax-channel-service
    restart: always
    environment:
      # Database Configuration (harnax_admin: shared with admin service)
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:mysql://mysql:3306/harnax_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-harnax}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-harnax123}
      # Flyway Configuration (disabled: admin manages migrations for harnax_admin db)
      SPRING_FLYWAY_ENABLED: "${FLYWAY_ENABLED:-false}"
      # Router Configuration
      ROUTER_URL: http://router:8081
      # Admin Service (for API key auto-fetch)
      ADMIN_SERVICE_URL: ${ADMIN_SERVICE_URL:-http://admin:8080}
      ADMIN_INTERNAL_API_SECRET: ${ADMIN_INTERNAL_API_SECRET:-change-me-in-production-min-32-chars!!}
      # Router API Key：配置后不再向 admin 申请；留空则沿用自动获取，但要求 admin 先于本容器可用。
      CHANNEL_API_KEY: ${CHANNEL_API_KEY:-}
      # Auth Configuration
      SERVICE_ID: ${CHANNEL_SERVICE_ID:-channel-0}
      HARNAX_AUTH_SECRET: ${HARNAX_AUTH_SECRET:-change-me-in-production-min-32-chars!!}
      # JVM Configuration
      JAVA_OPTS: -Xms128m -Xmx384m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication
      # Log Configuration
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Listener ownership (MySQL GET_LOCK): only one instance drives the long-lived connections
      CHANNEL_LOCK_ENABLED: ${CHANNEL_LOCK_ENABLED:-true}
      CHANNEL_LOCK_NAME: ${CHANNEL_LOCK_NAME:-harnax-channel-listeners}
      # Channel table reconciliation
      CHANNEL_SYNC_INTERVAL_MS: ${CHANNEL_SYNC_INTERVAL_MS:-10000}
      CHANNEL_SYNC_MAX_STARTS: ${CHANNEL_SYNC_MAX_STARTS:-5}
      CHANNEL_RESTART_BACKOFF_INITIAL_MS: ${CHANNEL_RESTART_BACKOFF_INITIAL_MS:-2000}
      CHANNEL_RESTART_BACKOFF_MAX_MS: ${CHANNEL_RESTART_BACKOFF_MAX_MS:-300000}
      CHANNEL_STALE_HEARTBEAT_MS: ${CHANNEL_STALE_HEARTBEAT_MS:-180000}
      # Inbound turn processing: bounded thread pool + per-channel concurrency
      CHANNEL_TURN_POOL_SIZE: ${CHANNEL_TURN_POOL_SIZE:-24}
      CHANNEL_TURN_PER_CHANNEL: ${CHANNEL_TURN_PER_CHANNEL:-4}
      # In-memory conversation cache
      CHANNEL_SESSION_MAX_SESSIONS: ${CHANNEL_SESSION_MAX_SESSIONS:-10000}
      CHANNEL_SESSION_MAX_MESSAGES: ${CHANNEL_SESSION_MAX_MESSAGES:-500}
      CHANNEL_SESSION_IDLE_TTL_MIN: ${CHANNEL_SESSION_IDLE_TTL_MIN:-120}
      # Router call protection
      ROUTER_BREAKER_ENABLED: ${ROUTER_BREAKER_ENABLED:-true}
      ROUTER_BREAKER_FAILURE_THRESHOLD: ${ROUTER_BREAKER_FAILURE_THRESHOLD:-5}
      ROUTER_BREAKER_OPEN_DURATION_MS: ${ROUTER_BREAKER_OPEN_DURATION_MS:-30000}
      CHANNEL_STREAM_IDLE_TIMEOUT_MS: ${CHANNEL_STREAM_IDLE_TIMEOUT_MS:-180000}
      # 连接健康指示器（/actuator/health）。与上面的存活探针无关：平台连接断开只是服务降级，
      # 不是需要重拉的容器。
      CHANNEL_HEALTH_ENABLED: ${CHANNEL_HEALTH_ENABLED:-true}
      CHANNEL_HEALTH_FAILURE_GRACE_MS: ${CHANNEL_HEALTH_FAILURE_GRACE_MS:-60000}
    ports:
      - "28083:8083"
    volumes:
      - channel-service-logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mysql:
        condition: service_healthy
      router:
        condition: service_started
    healthcheck:
      # Liveness only: a channel platform being unreachable must not get the container killed.
      # Per-channel connection status lives in /actuator/health and /actuator/channels.
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 35s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    networks:
      - harnax-network

  # Local MCP Server (Weather tool, SSE on port 9002)
  mcp-server:
    image: harnax-mcp-server:latest
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: harnax-mcp-server
    restart: always
    ports:
      - "29002:9002"   # MCP server listens on 9002
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1', 9002)); s.close()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - harnax-network

  # Frontend Service (Nginx serving React SPA + API reverse proxy)
  frontend:
    image: harnax-frontend:latest
    container_name: harnax-frontend
    restart: always
    ports:
      # Standard ports on purpose: the browser opens this service without a port in the URL.
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - admin
      - router
      - agent-service
      - channel-service
      - scheduler
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.5'
          memory: 128M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    networks:
      - harnax-network

# ==========================================
# Volumes
# ==========================================
volumes:
  redis-data:
    driver: local
  minio-data:
    driver: local
  admin-logs:
    driver: local
  admin-skills:
    driver: local
  router-logs:
    driver: local
  agent-service-logs:
    driver: local
  channel-service-logs:
    driver: local
  scheduler-logs:
    driver: local

# ==========================================
# Networks
# ==========================================
networks:
  harnax-network:
    driver: bridge
