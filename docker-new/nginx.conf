server {
    listen 80;
    server_name localhost;
    
    # Disable Nginx global buffering to ensure streaming works properly
    proxy_buffering off;
    
    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_comp_level 6;
    # Do not compress SSE streams
    gzip_proxied no-store no-cache private expired auth;
    
    # Frontend static files
    root /usr/share/nginx/html;
    index index.html;
    
    # Static resource caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # ========================================
    # Router service (port 8081)
    # ========================================

    # Router SSE endpoints - must disable all buffering for real-time event streaming.
    # nginx location matching: longer prefix wins, so /api/router/agent/chat/stream
    # takes priority over /api/router/ and /api/.
    location ~ ^/api/router/agent/(chat/stream|confirm) {
        proxy_pass http://router:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) - critical settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_set_header Cache-Control "no-cache";
        proxy_set_header X-Accel-Buffering "no";
        gzip off;
        proxy_set_header Accept-Encoding "";
        chunked_transfer_encoding on;

        # SSE streams can be very long (AI reasoning)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 900s;  # 15 min, matches router.stream-timeout-minutes
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 1;
    }

    # Router API endpoints (health, instance, monitor, etc.)
    location /api/router/ {
        proxy_pass http://router:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Router monitor UI static pages
    # Proxies /ui, /index.html, /style.css, /app.js to router:8081
    location = /ui {
        proxy_pass http://router:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ========================================
    # Channel service (port 8083)
    # ========================================

    # Channel API endpoints (Feishu, WeChat integrations)
    location /api/channel/ {
        proxy_pass http://channel-service:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;   # channel operations may take longer
    }

    # Channel webhook endpoints (Feishu/WeChat callbacks)
    # Webhooks require longer timeout and SSE support
    location /api/channel/webhook/ {
        proxy_pass http://channel-service:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support for webhook streaming
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_set_header X-Accel-Buffering "no";
        gzip off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 600s;   # webhook long connection: 10 min
    }

    # ========================================
    # Scheduler service (port 8084)
    # ========================================

    # Scheduler API endpoints (agent task scheduling and execution)
    location /api/scheduler/ {
        proxy_pass http://scheduler:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;  # agent execution may take long
    }

    # ========================================
    # Admin service (port 8080)
    # ========================================

    # Admin API reverse proxy
    location /api/admin/ {
        proxy_pass http://admin:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (SSE)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;  # SSE requires longer read timeout
    }

    # AI/SSE endpoints
    location /ai/ {
        proxy_pass http://admin:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) support
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        proxy_set_header Cache-Control "no-cache";
        proxy_set_header X-Accel-Buffering "no";
        
        # Disable gzip for SSE
        gzip off;
        proxy_set_header Accept-Encoding "";
        
        # Chunked transfer encoding
        chunked_transfer_encoding on;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;  # SSE requires longer read timeout
        
        # Handle connection close
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 1;
    }
    
    # SPA routing support - all routes return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
